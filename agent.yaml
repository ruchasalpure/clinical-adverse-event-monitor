spec_version: "0.1.0"
name: clinical-adverse-event-monitor
version: 1.0.0
description: Performs real-time pharmacovigilance screening of electronic health records and trial notes to detect MedDRA-coded adverse drug reactions and drug-drug interactions.
author: "Rucha Salpure"
license: MIT
model:
  preferred: claude-opus-4-6
  fallback:
    - claude-sonnet-4-5-20250929
  constraints:
    temperature: 0.2
    max_tokens: 4096
skills:
  - meddra-pharmacovigilance
tools: []
delegation:
  mode: auto
runtime:
  max_turns: 50
  timeout: 300
compliance:
  risk_tier: standard
  frameworks: []
tags:
  - healthcare
  - autonomous-agent
  - opengap-verified
metadata:
  repository: "https://github.com/ruchasalpure/clinical-adverse-event-monitor"

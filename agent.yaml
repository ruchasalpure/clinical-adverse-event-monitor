spec_version: "0.1.0"
name: "clinical-adverse-event-monitor"
version: "1.0.0"
category: "healthcare"
author: "Rucha Salpure"
description: "Performs real-time pharmacovigilance screening of electronic health records and trial notes to detect MedDRA-coded adverse drug reactions and drug-drug interactions"
capabilities:
  - "meddra-pharmacovigilance"
  - "autonomous-decision-making"
  - "explainable-auditing"
  - "multi-agent-collaboration"
skills:
  - "meddra-pharmacovigilance"
tools:
  - "python_executor"
  - "audit_logger"
  - "schema_validator"
runtime:
  environment: "python3.11"
  memory_limit: "4GB"
  timeout_seconds: 300
governance:
  audit_logging: true
  human_in_the_loop: false
  maker_checker: true
  explainability_required: true
